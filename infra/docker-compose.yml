version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: subguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: subguard_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: subguard_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: subguard_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/subguard_dev?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: subguard_production_secret_key_32_chars_long
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '4000:4000'

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: subguard_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  redis_data:
